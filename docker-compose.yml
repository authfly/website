# Russian marketing site — build from this repo (Framework comes from go.mod).
services:
  authflyweb:
    build:
      context: .
      dockerfile: Dockerfile
    image: authfly/website:ru
    container_name: authflyweb
    restart: unless-stopped
    environment:
      APP_BIND: "0.0.0.0:8080"
      APP_DEFAULT_LOCALE: ru
      FIXTURE_DIR: /app/internal/adapters/fixture/data
      APP_STATIC_DIR: /app/web/static
      LOG_LEVEL: info
    ports:
      - "8080:8080"
