# Run from e:/ (parent of @_FlightPHP and @_Go):
#   docker compose -f @_FlightPHP/@AuthFlySite/docker-compose.yml up --build
services:
  authflyweb:
    build:
      context: ../..
      dockerfile: @_FlightPHP/@AuthFlySite/Dockerfile
    image: authfly/website:ru
    container_name: authflyweb
    restart: unless-stopped
    environment:
      APP_BIND: "0.0.0.0:8080"
      APP_DEFAULT_LOCALE: ru
      FIXTURE_DIR: /app/internal/adapters/fixture/data
      APP_STATIC_DIR: /app/web/static
      LOG_LEVEL: info
    ports:
      - "8080:8080"
